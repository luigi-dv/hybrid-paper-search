# Everything: docker compose up -d --build
# DB Only: docker compose up -d db
# Load the papers: docker compose run --rm loader

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: hps-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: hps
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
    ports:
      # Only reachable from this machine, not from the network (LuLu related ruleset: hps rule)
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d hps"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml:
    build: ./ml
    container_name: hps-ml
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      # Keep the model downloaded
      - hf-cache:/root/.cache/huggingface
    healthcheck:
      # The first start downloads the model so the start period is long.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s

  api:
    build: .
    container_name: hps-api
    restart: unless-stopped
    environment: &app-env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
      PGHOST: db
      ML_URL: http://ml:8001
      API_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: &app-deps
      db:
        condition: service_healthy
      ml:
        condition: service_healthy

  # Run loader with: docker compose run --rm loader
  loader:
    build: .
    profiles: ["tools"]
    command: ["npx", "tsx", "src/load.ts"]
    environment: *app-env
    depends_on: *app-deps

volumes:
  pgdata:
  hf-cache:
